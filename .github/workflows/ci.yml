name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: web/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r web/requirements-dev.txt

      - name: Run test suites
        run: python -m pytest -q web/tests worker/test_worker.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend syntax check
        run: node --check web/app/static/app.js

      - name: Shell script syntax check
        run: |
          for f in tools/*.sh; do
            bash -n "$f"
          done
